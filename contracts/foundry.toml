[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["CreatorAdvance"]

remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
